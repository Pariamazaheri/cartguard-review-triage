[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cartguard-review-triage"
version = "1.0.0"
readme = "README.md"
authors = [{name = "Paria Mazaheri"}]
description = "Retail feedback pipelines, missing-data resilience and class-imbalance evaluation"
requires-python = ">=3.11"
dependencies = ['numpy>=2,<3', 'pandas>=2.2,<4', 'scikit-learn>=1.6,<2', 'imbalanced-learn>=0.14,<1', 'joblib>=1.4,<2', 'matplotlib>=3.9,<4', 'seaborn>=0.13,<1']
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "build>=1"]
[project.scripts]
cartguard = "cartguard.cli:main"
[project.urls]
Repository = "https://github.com/Pariamazaheri/cartguard-review-triage"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]
